name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.x is the floor (node:sqlite); 24.x is what we develop on.
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # No API key and no Minecraft server: the suite runs against
      # FakeEnvironment and the rule-based reasoning provider.
      - run: npm test
      - run: npm run build
